<style>

dt.hdlist1 > a.anchor {
  position: absolute;
  width: 1.5ex;
  margin-left: -1.5ex;
  text-decoration: none;
  visibility: hidden;
  text-align: center;
  font-weight: 400;
}
dt.hdlist1 > a.anchor::before { content: "\00A7"; font-size: .85em; }
dt.hdlist1:hover > a.anchor, dt.hdlist1 > a.anchor:hover { visibility: visible; }
</style>

<meta name="manual-version" content="{revnumber}">
<!-- The selection of the version sits in the top left corner, opposite the
corner that links to the project, and is as wide as its longest version. -->
<style>
select.manual-version {
  position: absolute;
  top: .5em;
  left: .5em;
  width: auto;
}
</style>
<!-- Lists the versions of the published site of all releases in the top left
corner, which versions.json at the root of the site names. The page lies at the
root or below its version. -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const version = document.querySelector('meta[name="manual-version"]').content;
  const directory = location.pathname.replace(/[^/]*$/, "");
  const root = directory.endsWith(`/${version}/`)
    ? directory.slice(0, -(version.length + 1))
    : directory;
  let versions;

  try {
    const response = await fetch(root + 'versions.json');
    versions = response.ok ? await response.json() : [];
  } catch {
    versions = [];
  }

  if (versions.length < 2) {
    return;
  }

  const select = document.createElement("select");
  select.className = "manual-version";
  select.setAttribute("aria-label", "Version of the manual");

  for (const name of versions) {
    select.add(new Option(name, `${root}${name}/`, false, name === version));
  }

  select.addEventListener("change", () => {
    location.href = select.value;
  });

  document.body.prepend(select);
});
</script>
