# Runs the tests, which need git, zsh, fish and their completions.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install --yes --no-install-recommends git pipx
          bash-completion zsh fish asciidoctor groff-base pkgconf
      # The recipes take options, which just supports from 1.46, a release newer
      # than that of Ubuntu.
      - run: sudo pipx install --global rust-just==1.59.0
      - uses: actions/checkout@v7
      - run: just test
