stages:
  - lint
  - test

# Checks that every file states its copyright and license.
reuse:
  stage: lint
  image:
    name: fsfe/reuse:6
    entrypoint: [""]
  script:
    - reuse lint

# Checks the scripts and completions with the linters and formatters of their
# shells, each in a job of its own. Each check runs the recipe lint-<check>
# with the Ubuntu package of the same name, except shfmt, which formats
# differently from release to release and therefore comes from the release
# the scripts are formatted with.
lint:
  stage: lint
  image: ubuntu:26.04
  parallel:
    matrix:
      - CHECK: [shellcheck, shfmt, zsh, fish]
  variables:
    SHFMT_VERSION: 3.14.1
    SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
  script:
    - apt-get update
    - |
      if [ "${CHECK}" = shfmt ]; then
          apt-get install --yes --no-install-recommends pipx ca-certificates curl
          curl -fsSL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /usr/local/bin/shfmt" | sha256sum --check
          chmod +x /usr/local/bin/shfmt
      else
          apt-get install --yes --no-install-recommends pipx "${CHECK}"
      fi
    # The recipes take options, which just supports from 1.46, a release newer
    # than that of Ubuntu.
    - pipx install --global rust-just==1.59.0
    - just "lint-${CHECK}"

# Runs the tests, which need git, zsh, fish and their completions.
tests:
  stage: test
  image: ubuntu:26.04
  script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends git pipx
      bash-completion zsh fish asciidoctor ruby-rouge groff-base pkgconf debhelper
      makepkg pacman-package-manager libarchive-tools zstd
    # The recipes take options, which just supports from 1.46, a release newer
    # than that of Ubuntu.
    - pipx install --global rust-just==1.59.0
    # makepkg refuses to run as root, which the image is. A test that lacks a
    # tool fails instead of being skipped.
    - useradd --create-home tester
    - chown -R tester: .
    - su tester -c 'REQUIRE_ALL_TESTS=1 just test'

# Builds the Debian and pacman packages and the tarball, with the version of
# the sources, to check the packaging without publishing anything.
packages:
  stage: test
  image: ubuntu:26.04
  script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends git pipx asciidoctor
      groff-base debhelper makepkg pacman-package-manager libarchive-tools zstd
    # The recipes take options, which just supports from 1.46, a release newer
    # than that of Ubuntu.
    - pipx install --global rust-just==1.59.0
    # makepkg refuses to run as root, which the image is.
    - useradd --create-home packager
    - chown -R packager: .
    - su packager -c 'just deb && just pacman && just tarball'
