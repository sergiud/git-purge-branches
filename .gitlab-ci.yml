stages:
  - lint
  - test

# Checks the copyright and license of every file, and the scripts and
# completions with the linters and formatters of their shells.
lint:
  stage: lint
  image: ubuntu:26.04
  script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends git pipx reuse
      shellcheck zsh fish
    # The recipes take options, which just supports from 1.46, a release newer
    # than that of Ubuntu.
    - pipx install --global rust-just==1.59.0
    # The recipe of the justfile runs the checks, so that they are listed once.
    - just lint

# Runs the tests, which need git, zsh, fish and their completions.
tests:
  stage: test
  image: ubuntu:26.04
  script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends git pipx
      bash-completion zsh fish asciidoctor groff-base pkgconf
    # The recipes take options, which just supports from 1.46, a release newer
    # than that of Ubuntu.
    - pipx install --global rust-just==1.59.0
    - just test
